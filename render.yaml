# Render Blueprint: one click deploy of API + Postgres. See docs/08-cloud-deploy.md
services:
  - type: web
    name: lastseat-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Staging-style pilot: fake payments and console OTP (codes appear in logs). See docs/09-owner-checklist.md.
      - key: APP_ENV
        value: staging
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lastseat-db
          property: connectionString
databases:
  - name: lastseat-db
    plan: free
